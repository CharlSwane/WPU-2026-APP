<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d5c3b"><meta name="description" content="Westelike Posduif Unie – 2026">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/wpu-logo.jpg">
<title>WPU 2026</title>
<style>
:root{--green:#0d5c3b;--gold:#b59b4c;--cream:#f7f5ef;--dark:#17362b;--muted:#68746e;--card:#fff;--line:#dfe5e1;--danger:#a52d2d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--cream);color:var(--dark)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;padding:9px 16px}.logo{width:54px;height:54px;object-fit:contain}.brand{font-weight:900;line-height:1.05}.brand small{display:block;color:var(--muted);font-weight:600;margin-top:3px}
nav{max-width:1100px;margin:auto;display:flex;gap:5px;overflow:auto;padding:0 12px 10px}.navbtn{white-space:nowrap;border:0;background:transparent;padding:9px 12px;border-radius:20px;color:var(--dark);font-weight:700;cursor:pointer}.navbtn.active,.navbtn:hover{background:var(--green);color:white}
main{max-width:1100px;margin:auto;padding:22px 14px 60px}.hero{background:linear-gradient(135deg,var(--green),#154c37);color:#fff;border-radius:24px;padding:25px;display:flex;align-items:center;gap:20px;box-shadow:0 10px 30px #0d5c3b22}.hero img{width:90px;height:90px;object-fit:contain;background:white;border-radius:20px;padding:6px}.hero h1{margin:0 0 7px;font-size:clamp(28px,5vw,44px)}.hero p{margin:0;opacity:.9}
h2{margin:28px 0 13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #17362b0b}.card .body{padding:15px}.card h3{margin:0 0 6px}.meta{color:var(--muted);font-size:13px}.winner-img,.event-img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#e9eeeb}.winner-img.placeholder,.event-img.placeholder{object-fit:contain;padding:35px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 15px}.chip{border:1px solid var(--line);background:white;border-radius:20px;padding:8px 12px;cursor:pointer;font-weight:700}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.pdf{display:flex;align-items:center;gap:12px;padding:13px;background:white;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}.pdf .ico{font-size:26px}.pdf a{margin-left:auto;text-decoration:none;background:var(--green);color:white;padding:8px 12px;border-radius:10px;font-weight:700}.pdf .btn{margin-left:auto}.pdfmodal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:12px}.pdfbox{width:min(1100px,100%);height:min(92vh,900px);background:white;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.pdfhead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;justify-content:space-between}.pdfhead .actions{margin:0}.pdfbox iframe{width:100%;height:100%;border:0;background:#ddd}
.info{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;white-space:pre-wrap}.notice{padding:12px 14px;background:#fff8dd;border:1px solid #e8d68e;border-radius:12px;margin:12px 0}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.admin{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.admin h3{margin-top:0}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-weight:750;font-size:13px}.field input,.field textarea,.field select{font:inherit;border:1px solid #cfd8d3;border-radius:10px;padding:10px;background:#fff}.field textarea{min-height:90px;resize:vertical}.btn{border:0;background:var(--green);color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.btn.secondary{background:#e9eeeb;color:var(--dark)}.btn.danger{background:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{padding:10px;border-radius:10px;background:#edf7f1;margin-top:10px}.hidden{display:none!important}.small{font-size:12px;color:var(--muted)}

.event-card .event-img{cursor:pointer}
.event-img{display:block;object-fit:cover;object-position:center;width:100%;aspect-ratio:16/10;min-height:180px}
.winner-img{display:block;object-fit:contain;object-position:center;width:100%;aspect-ratio:4/3;padding:10px;background:#f4f6f5}
.adminitem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.adminitem .actions{margin-top:0}
.maplink{display:inline-block;margin-top:8px;padding:8px 11px;border-radius:10px;background:#edf7f1;color:var(--green);font-weight:800;text-decoration:none}
.gallerybox{width:min(1000px,100%);height:min(92vh,900px);background:white;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.gallerymain{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#111;padding:10px}
.gallerymain img{max-width:100%;max-height:100%;object-fit:contain}
.gallerythumbs{display:flex;gap:8px;overflow:auto;padding:10px;background:white;border-top:1px solid var(--line)}
.gallerythumbs img{width:76px;height:58px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.gallerythumbs img:hover{border-color:var(--green)}
@media(max-width:600px){.adminitem{align-items:flex-start}.adminitem .actions{flex-shrink:0}.gallerythumbs img{width:64px;height:50px}}

footer{text-align:center;padding:25px;color:var(--muted);font-size:12px}
@media(max-width:600px){.hero{padding:18px}.hero img{width:65px;height:65px}.top{padding-left:10px}.brand{font-size:15px}main{padding-top:15px}}
</style></head>
<body>
<header><div class="top"><img class="logo" src="assets/wpu-logo.jpg"><div class="brand">WESTELIKE POSDUIF UNIE<small>WPU 2026 • Jaarboek & Nuus • 🟢 LIVE</small></div></div><nav id="nav"></nav></header>
<main id="app"></main><footer>Westelike Posduif Unie • 2026</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js" onerror=""></script><script src="app.js"></script>
</body></html>
